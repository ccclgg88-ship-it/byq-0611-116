server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/octet-stream model/gltf+json;
    gzip_min_length 1024;

    location ~* \.(gltf|glb)$ {
        types { }
        default_type model/gltf+json;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
